name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PDF extraction runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Text hygiene
        run: npm run check:text

      - name: Episode contract
        run: npm run check:episodes

      - name: Catalog rights and taxonomy gate
        run: npm run catalog:validate

      - name: 25-book candidate registry
        run: npm run catalog:candidates:validate

      - name: Factory configuration
        run: npm run factory:validate

      - name: P0 extractor contracts
        run: npm run pipeline:extractors:validate

      - name: Golden Pipeline v1 contract
        run: npm run pipeline:golden:validate

      - name: Golden Pipeline v2 dry run
        run: npm run pipeline:golden:dry-run:validate

      - name: Shared Persian voice contract
        run: npm run pipeline:voice:validate

      - name: Gemini voice adapter contract
        run: npm run pipeline:voice:gemini:validate

      - name: Dual-voice resume contracts
        run: npm run voice:dual:resume:validate

      - name: Production build
        run: npm run build
