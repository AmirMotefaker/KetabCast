name: Zobdino Golden Live TTS Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOLDEN_LIVE_PROBE_OUT: .golden-live-tts-probe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Golden Pipeline v4 contract
        run: npm run pipeline:golden:live-probe:validate

      - name: Validate secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || {
            echo "::error::GEMINI_API_KEY is required for this opt-in live probe."
            exit 1
          }

      - name: Run controlled Sulafat and Iapetus probe
        run: node --experimental-strip-types scripts/golden-live-tts-probe.mjs

      - name: Upload non-public probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zobdino-golden-live-tts-probe-${{ github.run_id }}
          path: .golden-live-tts-probe
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: true
