name: Zobdino Live Persian Voice Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VOICE_PROBE_OUT: .voice-live-probe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || {
            echo "::error::GEMINI_API_KEY is required for this opt-in live probe."
            exit 1
          }

      - name: Run Sulafat and Iapetus live probe
        run: node --experimental-strip-types scripts/live-gemini-voice-probe.mjs

      - name: Upload private probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zobdino-live-voice-probe-${{ github.run_id }}
          path: .voice-live-probe
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: true
